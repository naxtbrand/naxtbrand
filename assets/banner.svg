<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="NaxtBrand - Digital Experiences and Intelligent Automation">
<defs>
  <clipPath id="round"><rect width="1280" height="440" rx="28"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060a"/><stop offset="1" stop-color="#0c0e1a"/></linearGradient>
  <radialGradient id="orb1"><stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/></pattern>
  <radialGradient id="fade" cx="0.5" cy="0.5" r="0.65"><stop offset="0.25" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="gridmask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="620" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.42" stop-color="#ffffff"/>
    <stop offset="0.5" stop-color="#8be9ff"/><stop offset="0.58" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-700 0" to="1400 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
    <stop offset="0" stop-color="#818cf8" stop-opacity="0"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="1280 0" dur="4.5s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="reveal"><rect x="340" y="120" width="0" height="130">
    <animate attributeName="width" from="0" to="860" dur="1.3s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="1020" cy="120" r="320" fill="url(#orb1)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-90 50;0 0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="400" r="300" fill="url(#orb2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;110 -40;0 0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="60" r="2.2" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.0s" begin="0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.0s" repeatCount="indefinite"/></circle><circle cx="760" cy="120" r="1.6" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.5s" begin="0.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7.5s" repeatCount="indefinite"/></circle><circle cx="900" cy="80" r="2.0" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.6s" begin="0.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5.6s" repeatCount="indefinite"/></circle><circle cx="1040" cy="150" r="1.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="6.0s" begin="0.8999999999999999s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="8.0s" repeatCount="indefinite"/></circle><circle cx="1150" cy="70" r="2.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.6s" begin="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.6s" repeatCount="indefinite"/></circle><circle cx="1200" cy="260" r="1.6" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.0s" begin="1.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7.0s" repeatCount="indefinite"/></circle><circle cx="980" cy="330" r="2.0" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="1.7999999999999998s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.2s" repeatCount="indefinite"/></circle><circle cx="820" cy="380" r="1.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="6.2s" begin="2.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="8.2s" repeatCount="indefinite"/></circle><circle cx="560" cy="390" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" begin="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5.8s" repeatCount="indefinite"/></circle><circle cx="420" cy="60" r="1.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.2s" begin="2.6999999999999997s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7.2s" repeatCount="indefinite"/></circle><circle cx="60" cy="90" r="1.8" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.4s" begin="3.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6.4s" repeatCount="indefinite"/></circle><circle cx="70" cy="350" r="1.4" fill="#ffffff" opacity="0.15"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5.8s" begin="3.3s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7.8s" repeatCount="indefinite"/></circle>

  <!-- logo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite"/>
    <circle cx="205" cy="215" r="132" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="1 11" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 205 215" to="360 205 215" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="205" cy="215" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
      <animate attributeName="r" values="108;114;108" dur="5s" repeatCount="indefinite"/>
    </circle>
    <image href="data:image/png;base64," x="140" y="150" width="130" height="130" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.1s" fill="freeze"/>
    </image>
  </g>

  <!-- copy -->
  <text x="352" y="138" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#22d3ee" opacity="0">DIGITAL AGENCY  /  DHAKA, BANGLADESH
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>
  <g clip-path="url(#reveal)">
    <text x="348" y="236" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#shine)">NaxtBrand</text>
  </g>
  <text x="352" y="286" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="400" fill="#c3c8d8" opacity="0">Digital Experiences &amp; Intelligent Automation
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.9s" begin="1.2s" fill="freeze"/>
  </text>
  <text x="352" y="330" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="5" fill="#6d7488" opacity="0">DESIGN   •   DEVELOPMENT   •   GROWTH
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- bottom sweep -->
  <rect x="0" y="437" width="1280" height="3" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="0" y="437" width="1280" height="3" fill="url(#sweep)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="439" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>